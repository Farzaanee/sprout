version: 1
# 32 entries: 24 genuine AI startups plus 8 deliberately chosen Other/non-startup names
# (shell companies, dormant companies, membership associations, name-collision risks) drawn
# from the candidate pool's top-scoring but miscategorised results.
#
# One field per source-sheet column, each with its own *_sources list (no bundled source list):
#   - one_liner / one_liner_sources            reference only, not scored
#   - status / status_sources                  reference only, not scored today (BusinessStatus)
#   - stage_sources                            backs the top-level `stage`
#   - last_round (incl. its own sources)       scored (funding metrics)
#   - total_raised / valuation (incl. sources) reference only, not scored unless metrics.py is
#                                               extended to read them
#   - business_model / business_model_sources  reference for the judge
#   - target_user / target_user_sources        reference for the judge
# This matches the schema in phase-4-evals-guardrails.md; golden.py does not exist yet.
