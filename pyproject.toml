[project]
name = "sprout"
version = "0.1.0"
description = "Sourced dataset of UK AI startups, served via Streamlit and an MCP server"

requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = ["live: calls the real Claude API (needs ANTHROPIC_API_KEY)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
